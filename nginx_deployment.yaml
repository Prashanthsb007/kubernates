4️⃣ CANARY Deployment

🟦 Stable Deployment (4 replicas)

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-stable
spec:
  replicas: 4
  selector:
    matchLabels:
      app: nginx-canary
      track: stable
  template:
    metadata:
      labels:
        app: nginx-canary
        track: stable
    spec:
      containers:
      - name: nginx
        image: nginx:1.28
        ports:
        - containerPort: 80

🟨 Canary Deployment (1 replica)

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-canary
      track: canary
  template:
    metadata:
      labels:
        app: nginx-canary
        track: canary
    spec:
      containers:
      - name: nginx
        image: nginx:1.29.3  # nginxdemos/hello:0.4-plain-text # image: nginxdemos/hello:latest
        ports:
        - containerPort: 80

apiVersion: v1
kind: Service
metadata:
  name: nginx-service-canary
  labels:
    app: nginx-canary
spec:
  type: NodePort
  selector:
    app: nginx-canary     # IMPORTANT: No track label here
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30010

-->Traffic split based on pod count:

4 stable
1 canary
~20% traffic to new version
It is simple round-robin / random distribution.
----------------
4 Stable Pods
     +
1 Canary Pod
     ↓
nginx-service-canary
     ↓
~80% → Stable
~20% → Canary

