🔄 Service Switch
Service initially points to blue:
apiVersion: v1
kind: Service
metadata:
  name: nginx-service-bluegreen
  labels:
    app: nginx-bluegreen
spec:
  type: NodePort  # Change to LoadBalancer if using cloud
  selector:
    app: nginx-blue
    version: blue
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30009
    

To switch to green:
selector:
  app: nginx-green
  version: green
