2️⃣ ROLLING UPDATE (Reference)

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment-rolling
spec:
  replicas: 4
  selector:
    matchLabels:
      app: nginx-rolling
  minReadySeconds: 10   #A newly created Pod must stay in Ready state for at least 10 seconds before Kubernetes considers it Available.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: nginx-rolling
    spec:
      containers:
      - name: nginx
        image: nginx:1.28 # new version - nginx:1.29.3 # image: nginxdemos/hello:latest
        ports:
        - containerPort: 80


🔵 NodePort Service YAML
apiVersion: v1
kind: Service
metadata:
  name: nginx-service-rolling
  labels:
    app: nginx-rolling
spec:
  type: NodePort
  selector:
    app: nginx-rolling
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30008   # Optional (auto-assign if removed)

🔵 LoadBalancer Service (AWS EKS)

apiVersion: v1
kind: Service
metadata:
  name: nginx-service-rolling-lb
  labels:
    app: nginx-rolling
spec:
  type: LoadBalancer
  selector:
    app: nginx-rolling
  ports:
  - port: 80  # External LB listens on 80
    targetPort: 80  # Forwards to container port 80

