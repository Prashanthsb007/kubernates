1️⃣ RECREATE Strategy

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment-recreate
spec:
  replicas: 4
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nginx-recreate
  template:
    metadata:
      labels:
        app: nginx-recreate
    spec:
      containers:
      - name: nginx
        image: nginx:1.28       # new version - nginx:1.29.3  # nginxdemos/hello:0.4-plain-text
        ports:
        - containerPort: 80

🔵 NodePort Service YAML

apiVersion: v1
kind: Service
metadata:
  name: nginx-service-recreate
  labels:
    app: nginx-recreate
spec:
  type: NodePort
  selector:
    app: nginx-recreate
  ports:
  - port: 80    # The Service will listen on port 80.  # Service is a virtual load balancer inside the cluster.
    targetPort: 80    # iptables (created by kube-proxy) forwards to: PodIP:targetPort
    nodePort: 30007   # You can change or remove this to auto-assign


